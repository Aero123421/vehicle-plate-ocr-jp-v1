[project]
name = "vehicle-plate-ocr-jp-v1"
version = "0.6.5"
description = "Japanese vehicle & license plate detection, tracking, and patent-clean multi-frame OCR (13.72 MiB INT8 ONNX)"
license = { file = "LICENSE" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "data/fonts/*-OFL.txt"]
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "vehicle-plate-ocr-jp-v1 Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0",
    "pyyaml>=6.0.1",
    "torch>=2.15.0",
    "onnx>=1.23.2",
    "onnxruntime-gpu>=1.31.1",
    "onnxscript>=0.7.2",
]

[project.scripts]
vehicle-plate-ocr-jp-v1 = "vehicle_plate_ocr_jp_v1.cli:main"
vpocr-synth = "vpocr_synth.cli:main"
vpocr-ocr = "vpocr_ocr.cli:main"
vpocr-det = "vpocr_det.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_plate_ocr_jp_v1", "src/vpocr_synth", "src/vpocr_ocr", "src/vpocr_det"]

[tool.hatch.build.targets.wheel.force-include]
"web/models" = "vehicle_plate_ocr_jp_v1/assets/web/models"

[tool.hatch.build.targets.sdist]
exclude = ["/out", "/docs/refs", "/web/node_modules", "/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
