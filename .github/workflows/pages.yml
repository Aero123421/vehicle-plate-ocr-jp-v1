name: Deploy browser demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Upload web/ directly: no Jekyll build rewrites module/WASM artifacts.
      - name: Require plain static demo artifacts
        run: |
          test -f web/.nojekyll
          test -f web/worker.mjs
          test -f web/vendor/ort-wasm-simd-threaded.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
