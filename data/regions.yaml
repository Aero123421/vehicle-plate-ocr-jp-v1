# 日本の自動車ナンバープレート 地域名一覧 (138地域)
#
# 国土交通省公式資料との突合確認済み (確認日: 2026-11-11)
# 確認元公式URL:
#   1. 自動車検査・登録ガイド 全国の運輸支局・事務所管轄一覧
#      https://www.mlit.go.jp/jidosha/kensatoroku/sikyoku/
#   2. 地方版図柄入りナンバープレート導入地域一覧 (全国138地域分割基盤)
#      https://www.mlit.go.jp/jidosha/jidosha_tk6_000034.html
#   3. 新たな地域名表示（ご当地ナンバー）導入要綱・発表資料
#      https://www.mlit.go.jp/jidosha/jidosha_tk6_000017.html
#   4. 道路運送車両法施行規則 第11条 別表 第一号様式 (昭和26年運輸省令第74号)
#
# 文字数内訳 (計138地域、欠落・余剰なし完全一致):
#   1文字: 2地域 (柏, 堺)
#   2文字: 111地域
#   3文字: 23地域
#   4文字: 2地域 (尾張小牧, 伊勢志摩)
#
# 特記事項:
# - 「袖ヶ浦」の第2文字「ケ」は法令上、縦33mm・横28mm（通常30x40mmより小さい）と規定される。
# - 「富士山」は山梨県および静岡県の両県で交付される（運輸支局が異なる）。
# - 1文字地域名（「柏」「堺」）は上段中央寄り（x=95..135mm）に配置。
